<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KI-Use-Case-Techn. Bewertung</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: rgba(255,255,255,0.86);
      --card: #ffffff;
      --text: #0f1b2d;
      --muted: #54637a;
      --line: #d4deea;
      --primary: #3856ff;
      --primary-soft: #eaf0ff;
      --ok: #198754;
      --warn: #c28a00;
      --bad: #c62828;
      --radius: 16px;
      --shadow: 0 12px 40px rgba(27, 44, 94, .12);
      --focus: #111111;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: Inter, Segoe UI, Roboto, Arial, sans-serif; color: var(--text); background: radial-gradient(circle at 80% -20%, #dde6ff 0, transparent 45%), radial-gradient(circle at 10% 5%, #e8f6ff 0, transparent 38%), var(--bg); }
    a { color: var(--primary); }
    .container { width: min(1280px, 94vw); margin: 0 auto; }
    .hero { padding: 32px 0 18px; }
    .hero-panel {
      background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(242,247,255,.92));
      border: 1px solid #dce5f3;
      box-shadow: var(--shadow);
      border-radius: 28px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .hero-panel::after { content: ""; position: absolute; inset: -30% -10% auto auto; width: 380px; height: 380px; background: radial-gradient(circle, rgba(56,86,255,.18), transparent 60%); pointer-events: none; }
    .kicker { letter-spacing: .1em; text-transform: uppercase; font-size: .74rem; color: #36568f; font-weight: 700; }
    h1 { margin: 10px 0 8px; font-size: clamp(1.8rem, 3.4vw, 3rem); line-height: 1.08; }
    .sub { color: var(--muted); max-width: 880px; font-size: 1.02rem; }
    .metrics { margin-top: 20px; display: grid; grid-template-columns: repeat(4, minmax(140px,1fr)); gap: 12px; }
    .metric { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 104px; box-shadow: 0 4px 16px rgba(22,36,71,.06); }
    .metric .label { font-size: .74rem; color: #35507e; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .metric .value { margin-top: 8px; font-size: 1.02rem; font-weight: 700; }
    .metric.empty .value { color: #7585a2; font-weight: 500; }

    .layout { display: grid; grid-template-columns: 1.5fr .85fr; gap: 18px; margin: 18px 0 28px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(4px); }
    .card:hover { transform: translateY(-1px); transition: .2s ease; }
    .card-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .card-title { margin: 0; font-size: 1rem; }
    .card-body { padding: 14px 16px 16px; }

    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(200px,1fr)); gap: 12px; }
    .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; font-size: .91rem; }
    input, select, textarea {
      border: 1px solid #bac9dd; background: #fff; color: var(--text);
      border-radius: 10px; padding: 10px 11px; font-size: .94rem; line-height: 1.35;
    }
    textarea { min-height: 84px; resize: vertical; }
    .hint { color: #6a7690; font-size: .8rem; }
    .inline-error { font-size: .8rem; color: var(--bad); min-height: 16px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
    button {
      border: 1px solid #b5c6e5; background: #fff; color: #11203a; border-radius: 10px;
      padding: 10px 12px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: linear-gradient(120deg, #3657ff, #5f74ff); color: white; border: none; }
    button.subtle { background: #f7faff; }
    button:hover { filter: brightness(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #fff;
    }

    .sticky { position: sticky; top: 14px; }
    .status-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .status-item { border: 1px dashed #bed0e8; border-radius: 12px; padding: 10px; background: #fff; }

    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: .78rem; font-weight: 700; border: 1px solid transparent; }
    .b-green { color: #0f6237; background: #dff5ea; border-color: #9ad4b8; }
    .b-yellow { color: #745500; background: #fff3ce; border-color: #e6ca71; }
    .b-red { color: #7d1e1e; background: #ffe0df; border-color: #e9a2a2; }
    .b-blue { color: #1a3d91; background: #e4ecff; border-color: #b7c8ff; }

    #results { display: none; margin-bottom: 30px; }
    .result-top { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .score-wrap { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .score-bar { height: 12px; border-radius: 999px; background: #e6edf7; overflow: hidden; }
    .score-fill { height: 100%; width: 0; transition: width 1.1s ease; background: linear-gradient(90deg,#5170ff,#18b3a6); }

    .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
    .list { margin: 8px 0 0; padding-left: 20px; }

    .tabs { margin-top: 14px; }
    .tab-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab-btn[aria-selected="true"] { background: #112957; color: #fff; border-color: #112957; }
    .tab-panel { display: none; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
    .tab-panel.active { display: block; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0d1730; color: #d9e8ff; padding: 12px; border-radius: 8px; overflow: auto; }

    .toast { position: fixed; right: 16px; bottom: 16px; background: #0c213f; color: #fff; padding: 10px 12px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: .25s; z-index: 99; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 980px) {
      .layout, .result-top { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .form-grid, .grid3 { grid-template-columns: 1fr; }
    }

    @media print {
      body * { visibility: hidden !important; }
      #managementSummary, #managementSummary * { visibility: visible !important; }
      #managementSummary { position: absolute; inset: 0; background: #fff; padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero" aria-label="Kopfbereich">
      <div class="hero-panel">
        <div class="kicker">AI Governance Cockpit</div>
        <h1>KI-Use-Cases bewerten. Schärfer. Schneller. Übergabefähig.</h1>
        <p class="sub">Ein lokales Analyse-Cockpit für fachliche Reife, technische Machbarkeit, EU-AI-Act-Risiko und JIRA-fähige Rückfragen.</p>
        <div class="metrics" id="heroMetrics" aria-live="polite"></div>
      </div>
    </section>

    <section class="layout" aria-label="Analysecockpit">
      <div id="formCol"></div>
      <aside class="card sticky" aria-label="Assessment Sidebar">
        <div class="card-head"><h2 class="card-title">Assessment Panel</h2></div>
        <div class="card-body" id="sidebarState"></div>
      </aside>
    </section>

    <section id="results" aria-live="polite">
      <div class="card">
        <div class="card-head"><h2 class="card-title">Bewertungsergebnis</h2></div>
        <div class="card-body" id="resultBody"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <script>
    const STORAGE_KEY = 'kiUseCaseDraftV1';
    let useCaseData = {};
    let lastAssessment = null;

    const sections = [
      { title:'Basisdaten', fields:[['title','Titel des Use Cases','text'],['businessUnit','Fachbereich / Organisationseinheit','text'],['submitter','Einreicher','text'],['ownerBusiness','fachliche verantwortliche Person','text'],['ownerTech','technische verantwortliche Person, falls bekannt','text'],['targetState','geplanter Zielzustand','select',['Idee','POC','MVP','Produktivbetrieb']]]},
      { title:'Prozess & Zielbild', fields:[['description','Kurzbeschreibung','textarea'],['goal','Ziel / Nutzen','textarea'],['process','betroffener Prozess','textarea'],['currentState','aktueller Prozess / Ist-Zustand','textarea'],['targetProcess','gewünschter Soll-Prozess','textarea'],['decisionSupport','konkrete Entscheidung oder Tätigkeit, die unterstützt werden soll','textarea'],['userGroup','erwartete Nutzergruppe','text'],['frequency','Nutzungshäufigkeit','text']]},
      { title:'Daten & Systeme', fields:[['inputData','Input-Daten','textarea'],['dataSources','Datenquellen','textarea'],['dataQuality','Datenqualität bekannt?','select',['Ja','Teilweise','Nein','Unklar']],['systems','technische Systeme / Schnittstellen','textarea'],['dataProvision','Datenbereitstellung','select',['API','Datenbank','Datei-Export','manuell','unklar']],['resultStorage','Speicherort der Ergebnisse, falls bekannt','text'],['rolesKnown','Berechtigungs- oder Rollenkonzept bekannt?','select',['Ja','Teilweise','Nein','Unklar']]]},
      { title:'KI-Logik & Output', fields:[['output','erwarteter Output','textarea'],['outputExample','Output-Beispiel','textarea'],['textGeneration','Wird Text generiert?','select',['Ja','Nein','Unklar']],['mlOps','Wird klassifiziert, prognostiziert oder optimiert?','select',['Ja','Nein','Unklar']],['chatInteraction','Wird mit einem Chatbot oder Assistenten interagiert?','select',['Ja','Nein','Unklar']],['externalOutput','Geht der Output nach außen?','select',['Ja','Nein','Unklar']],['humanReview','Muss ein Mensch das Ergebnis prüfen?','select',['Ja','Nein','Unklar']]]},
      { title:'Qualität & Betrieb', fields:[['qualityDefined','Gibt es definierte Qualitätskriterien?','select',['Ja','Teilweise','Nein','Unklar']],['qualityDesc','Beschreibung der Qualitätskriterien','textarea'],['acceptance','fachliche Abnahmekriterien','textarea'],['errorImpact','Fehlerfolgen bei falschem Ergebnis','textarea'],['operatingModel','gewünschtes Betriebsmodell','select',['Einmalige Analyse','Pilot','Regelbetrieb','Unklar']],['logging','Logging, Monitoring oder Auditierbarkeit erforderlich?','select',['Ja','Nein','Unklar']]]},
      { title:'Risiko & Datenschutz', fields:[['personalData','Personenbezogene Daten enthalten?','select',['Ja','Nein','Unklar']],['sensitiveData','Sensible Daten enthalten?','select',['Ja','Nein','Unklar']],['autoDecisionPeople','Automatisierte Entscheidung über Personen?','select',['Ja','Nein','Unklar']],['highRiskDomain','Hochrisikobereich?','select',['Ja','Nein','Unklar']],['externalEffect','Externe Wirkung auf Personen/Kund*innen?','select',['Ja','Nein','Unklar']],['transparencyDuty','Transparenz- oder Kennzeichnungspflichten?','select',['Ja','Nein','Unklar']],['privacyConcept','Datenschutz- oder Löschkonzept vorhanden?','select',['Ja','Teilweise','Nein','Unklar']]]},
      { title:'Wirtschaftlichkeit', fields:[['businessImpact','Wirtschaftlicher Nutzen / Business Impact','textarea'],['timeSaving','erwartete Zeitersparnis','text'],['qualityImprovement','erwartete Qualitätsverbesserung','text'],['costReduction','erwartete Kostenreduktion','text'],['strategy','strategische Relevanz','select',['Niedrig','Mittel','Hoch','Unklar']],['scale','betroffene Anzahl Nutzer*innen oder Vorgänge','text']]},
      { title:'Victors Notizen', fields:[['victorNotes','Freitextfeld „Victors Notizen“','textarea']]}
    ];

    function createForm() {
      const formCol = document.getElementById('formCol');
      const wrapper = document.createElement('form'); wrapper.id = 'useCaseForm';
      sections.forEach((sec, idx) => {
        const card = document.createElement('section'); card.className = 'card';
        card.innerHTML = `<div class="card-head"><h2 class="card-title">${idx+1}. ${sec.title}</h2></div><div class="card-body"><div class="form-grid" id="grid_${idx}"></div></div>`;
        const grid = card.querySelector('.form-grid');
        sec.fields.forEach(f => { const el = buildField(...f); grid.appendChild(el); });
        wrapper.appendChild(card);
      });
      const tools = document.createElement('div');
      tools.className = 'toolbar';
      tools.innerHTML = `<button type="button" class="primary" id="btnEvaluate">Use Case bewerten</button><button type="button" id="btnExample">Beispieldaten laden</button><button type="button" id="btnReset">Formular zurücksetzen</button><button type="button" id="btnSave">Zwischenstand speichern</button><button type="button" id="btnLoad">Gespeicherten Stand laden</button><button type="button" id="btnClear">Lokale Daten löschen</button>`;
      wrapper.appendChild(tools);
      formCol.appendChild(wrapper);
    }

    function buildField(name, label, type, options=[]) {
      const wrap = document.createElement('div'); wrap.className = 'field full';
      const id = `f_${name}`;
      const req = ['title','goal','inputData','dataSources','output','businessImpact'].includes(name) ? ' *' : '';
      let input = '';
      if (type === 'textarea') input = `<textarea id="${id}" name="${name}"></textarea>`;
      else if (type === 'select') input = `<select id="${id}" name="${name}"><option value="">Bitte wählen</option>${options.map(o=>`<option>${o}</option>`).join('')}</select>`;
      else input = `<input id="${id}" name="${name}" type="text" />`;
      wrap.innerHTML = `<label for="${id}">${label}${req}</label>${input}<div class="inline-error" id="err_${name}"></div>`;
      return wrap;
    }

    function collectFormData(){ const d={}; new FormData(document.getElementById('useCaseForm')).forEach((v,k)=>d[k]=(v||'').trim()); return d; }
    function populateForm(data){ Object.entries(data||{}).forEach(([k,v])=>{ const e=document.querySelector(`[name='${k}']`); if(e)e.value=v; }); }
    function validateForm(data){
      const req=['title','goal','inputData','dataSources','output','businessImpact']; let ok=true;
      req.forEach(k=>{ const miss=!data[k]; const err=document.getElementById('err_'+k); if(err)err.textContent=miss?'Bitte ergänzen.':''; if(miss) ok=false; });
      return {ok};
    }
    const hasAny = (s,keys)=>keys.some(k=>(s||'').toLowerCase().includes(k));
    function detectTemplateType(data){
      const corpus=[data.description,data.goal,data.output,data.dataSources].join(' ').toLowerCase();
      const llmK=['text','zusammenfassung','chatbot','e-mail','dokument','anfrage','antwort','wissensabfrage','prompt','llm','gpt','assistent','generieren','dokumentenanalyse','rag','knowledge base'];
      const mlK=['prognose','klassifikation','scoring','optimierung','vorhersage','mustererkennung','anomalie','machine learning','ml','modelltraining','regression','clustering','recommendation','forecast','predictive'];
      const llm = data.textGeneration==='Ja' || hasAny(corpus,llmK);
      const ml = data.mlOps==='Ja' || hasAny(corpus,mlK);
      if(llm && ml) return {type:'Hybrid: LLM + ML', reason:'Text-/LLM-Merkmale und ML-Merkmale gleichzeitig erkannt.'};
      if(llm) return {type:'LLM-orientiert', reason:'LLM-typische Merkmale (Textgenerierung, Assistenz oder Dokumentbezug) erkannt.'};
      if(ml) return {type:'ML-orientiert', reason:'ML-typische Merkmale (Klassifikation/Prognose/Optimierung) erkannt.'};
      return {type:'Unklar – Template muss fachlich nachgeschärft werden', reason:'Weder klare LLM- noch ML-Indikatoren erkennbar.'};
    }
    function assessCompleteness(data){
      const make=(name,ok,partial,why,improve)=>({name,status:ok?'Grün':partial?'Gelb':'Rot',bewertung:why,empfehlung:improve});
      const arr=[];
      arr.push(make('Fachliches Zielbild',!!data.goal,data.goal?.length>30,'Ziel/Nutzen bewertet.','Ziel mit KPI und Entscheidungskontext konkretisieren.'));
      arr.push(make('Prozessverständnis',!!data.process && !!data.currentState && !!data.targetProcess, !!data.process,'Prozesslandkarte bewertet.','Ist/Soll mit klaren Übergabepunkten beschreiben.'));
      arr.push(make('Datenbasis',!!data.inputData && !!data.dataSources && data.dataQuality==='Ja',!!data.inputData && !!data.dataSources,'Datenlage bewertet.','Quellen, Qualität und Verfügbarkeit konkretisieren.'));
      arr.push(make('Input-/Output-Logik',!!data.inputData && !!data.output && !!data.outputExample,!!data.output,'I/O-Logik bewertet.','Output-Beispiele inkl. Grenzfälle ergänzen.'));
      arr.push(make('Qualitätssicherung',data.qualityDefined==='Ja' && !!data.acceptance,data.qualityDefined==='Teilweise','QS bewertet.','Messbare Qualitäts- und Abnahmekriterien ergänzen.'));
      arr.push(make('Wirtschaftlichkeit',!!data.businessImpact && (data.timeSaving||data.qualityImprovement||data.costReduction),!!data.businessImpact,'Business Impact bewertet.','Nutzen quantifizieren (Zeit, Kosten, Qualität).'));
      arr.push(make('Technische Umsetzbarkeit',!!data.systems && data.dataProvision && data.dataProvision!=='unklar',!!data.systems,'Technik bewertet.','Schnittstellen, Datenfluss und Zielsystem schärfen.'));
      arr.push(make('Datenschutz / Risiko',data.personalData!=='Unklar' && data.privacyConcept!=='Unklar',data.personalData==='Unklar' || data.privacyConcept==='Teilweise','Datenschutzbewertung durchgeführt.','Datenschutz- und Löschkonzept konkretisieren.'));
      arr.push(make('MVP-/POC-Tauglichkeit',data.qualityDefined!=='Nein' && !!data.goal && !!data.output,data.qualityDefined==='Teilweise','MVP-Signal bewertet.','MVP-Umfang, Tests und Kriterien definieren.'));
      arr.push(make('Governance / Betrieb',data.logging!=='Unklar' && data.operatingModel!=='Unklar',data.operatingModel==='Pilot','Governance/Betrieb bewertet.','Betriebs- und Governance-Rahmen ergänzen.'));
      arr.push(make('Human-in-the-loop',data.humanReview==='Ja',data.humanReview==='Unklar','Menschliche Prüfung bewertet.','Prüfrolle mit Freigabepunkt definieren.'));
      arr.push(make('Übergabefähigkeit an IT',!!data.dataSources && !!data.systems && !!data.output,!!data.dataSources && !!data.output,'IT-Handover bewertet.','Quellsysteme, Schnittstellen und Ergebnisablage ergänzen.'));
      const missingKeys=['goal','inputData','dataSources','output','qualityDesc','personalData','humanReview','businessImpact','ownerBusiness','errorImpact','dataProvision','acceptance'];
      const missing = missingKeys.filter(k=>!data[k]||data[k]==='Unklar'||data[k]==='unklar');
      return {areas:arr, missing};
    }
    function assessEuAiActRisk(data){
      const txt=[data.description,data.goal,data.output].join(' ').toLowerCase();
      const banned=['manipulation','social scoring','biometrische','echtzeit','vulnerabler','emotionserkennung','diskriminierende'];
      let level='🟢 Geringes Risiko', reason='Interne Unterstützung ohne kritische Risikotreiber.', drivers=[], measures=[];
      if(hasAny(txt,banned)){ level='🔴 Inakzeptables Risiko'; reason='Hinweise auf potenziell verbotene Praktiken.'; drivers.push('Verbotene AI-Use-Pattern'); measures=['Use Case in dieser Form nicht weiterverfolgen','fachliche Zielsetzung neu schneiden','Compliance-/Legal-Prüfung einholen','verbotene Funktionalität entfernen']; }
      else if(data.highRiskDomain==='Ja' || (data.autoDecisionPeople==='Ja' && (data.personalData==='Ja'||data.sensitiveData==='Ja'))){ level='🟠 Hochrisiko'; reason='Hochrisiko-Kontext und personenbezogene Entscheidungswirkung erkannt.'; drivers.push('Hochrisikobereich / Personenentscheidung'); measures=['vertiefte rechtliche und regulatorische Prüfung','Risikomanagementprozess','Daten-Governance-Prüfung','technische Dokumentation','Protokollierung und Nachvollziehbarkeit','Human Oversight','Robustheit, Genauigkeit und Cybersicherheit prüfen','Freigabe durch zuständige Governance-Stelle']; }
      else if(data.textGeneration==='Ja'||data.chatInteraction==='Ja'||data.externalOutput==='Ja'){ level='🟡 Begrenztes Risiko'; reason='Interaktive oder generative KI mit Transparenzpflichten.'; drivers.push('Generative oder interaktive KI'); measures=['Transparenzhinweis, dass KI genutzt wird','Kennzeichnung KI-generierter Inhalte','menschliche Prüfung vor externer Verwendung','Dokumentation von Zweck, Grenzen und Verantwortlichkeiten','Qualitätssicherung anhand definierter Prüfkriterien','Möglichkeit zur Eskalation an Fachverantwortliche']; }
      if([data.personalData,data.sensitiveData,data.autoDecisionPeople,data.highRiskDomain].includes('Unklar') && level==='🟢 Geringes Risiko'){ level='🟡 Begrenztes Risiko'; reason+=' Risikoeinstufung nur vorläufig, da zentrale Angaben fehlen.'; }
      return {level, reason, drivers, measures};
    }
    function calculateReadinessScore(data, assessment){
      const map={ 'Fachliches Zielbild':15,'Prozessverständnis':10,'Datenbasis':15,'Input-/Output-Logik':10,'Qualitätssicherung':10,'Wirtschaftlichkeit':10,'Technische Umsetzbarkeit':10,'Datenschutz / Risiko':10,'Governance / Betrieb':5,'Human-in-the-loop':5 };
      let score=0; assessment.areas.forEach(a=>{ if(map[a.name]) score += a.status==='Grün'?map[a.name]:a.status==='Gelb'?Math.round(map[a.name]*.55):0;});
      if(assessment.missing.length>4) score=Math.min(score,39);
      else if(assessment.missing.length>=2) score=Math.min(score,74);
      if(data.personalData==='Unklar') score=Math.min(score,79);
      if(!data.dataSources) score=Math.min(score,69);
      if(data.qualityDefined==='Nein'||data.qualityDefined==='Unklar') score=Math.min(score,74);
      if(data.autoDecisionPeople==='Ja' && data.personalData==='Unklar') score=Math.min(score,49);
      return score;
    }
    function determineOverallTrafficLight(data, assessment){
      const reds=assessment.areas.filter(a=>a.status==='Rot').length, yellows=assessment.areas.filter(a=>a.status==='Gelb').length;
      if(assessment.missing.length>4 || reds>=4 || assessment.risk.level.includes('Inakzeptables')) return 'Rot';
      if(assessment.missing.length>=2 || yellows>=3 || data.personalData==='Unklar' || !data.dataSources) return 'Gelb';
      return (reds===0 && yellows<=2 && data.personalData!=='Unklar' && data.dataSources && data.qualityDefined!=='Nein' && data.businessImpact && data.humanReview==='Ja') ? 'Grün' : 'Gelb';
    }
    function determineCategory(data,a){ const s=a.score; if(s<40||a.traffic==='Rot')return {cat:'Nicht bewertungsreif',why:'Kernangaben fehlen oder Risiken/Lücken zu hoch.'}; if(data.strategy==='Hoch'&&data.systems&&data.businessImpact)return {cat:'Strategischer Use Case',why:'Hoher Impact und organisationsübergreifende Relevanz.'}; if(s>=75)return {cat:'MVP-tauglich',why:'Überwiegend klare Inputs, Nutzen, QS und Umsetzungsbild.'}; if(s>=70&&a.risk.level.includes('Geringes')) return {cat:'Quick Win',why:'Begrenzter Scope, klare Datenbasis und geringe Risiken.'}; if(s>=60)return {cat:'POC-tauglich',why:'Hypothese klar, jedoch Nachschärfung bei Details erforderlich.'}; return {cat:'POC-tauglich',why:'Früher Reifegrad mit Validierungspotenzial.'}; }
    function generateQuestions(data,a){ const q=[]; const add=(frage,adressat,prio,begr,bereich)=>q.push({frage,adressat,prio,begruendung:begr,bereich}); if(!data.goal) add('Welche konkrete Entscheidung, Tätigkeit oder Prozessverbesserung soll durch die KI unterstützt werden?','Einreicher','Hoch','Ohne klares Zielbild lässt sich der Nutzen nicht bewerten.','Fachliches Zielbild'); if(!data.inputData) add('Welche Eingangsdaten stehen heute bereits zur Verfügung und in welcher Qualität?','Einreicher','Hoch','Die Datenbasis ist entscheidend für Machbarkeit, Aufwand und Ergebnisqualität.','Datenbasis'); if(!data.output) add('Wie soll das Ergebnis der KI konkret aussehen? Bitte ergänze ein Beispiel.','Einreicher','Hoch','Ohne konkreten Output kann die IT keine sinnvolle Lösungsarchitektur ableiten.','Input-/Output-Logik'); if(data.qualityDefined==='Nein'||data.qualityDefined==='Unklar') add('Woran erkennt ihr fachlich, dass das KI-Ergebnis gut genug ist?','Einreicher','Hoch','Für POC, MVP und Produktivbetrieb braucht es messbare Qualitäts- und Abnahmekriterien.','Qualitätssicherung'); if(!data.businessImpact) add('Welcher messbare Nutzen wird erwartet?','Einreicher','Hoch','Ohne Nutzenbeschreibung ist eine Freigabe kaum belastbar.','Wirtschaftlichkeit'); if(data.humanReview==='Unklar'||data.humanReview==='Nein') add('Wer prüft das Ergebnis der KI vor Nutzung oder Weitergabe?','Einreicher','Mittel','Menschliche Prüfung ist bei risikobehafteten Use Cases zentral.','Human-in-the-loop'); if(!data.systems) add('Welche Quellsysteme liefern die Daten und gibt es dafür APIs, Datenbankzugriffe oder nur manuelle Exporte?','IT','Hoch','Die Datenbereitstellung beeinflusst Aufwand und Architektur.','Technische Umsetzbarkeit'); return q.sort((a,b)=>({Hoch:0,Mittel:1,Niedrig:2}[a.prio]-({Hoch:0,Mittel:1,Niedrig:2}[b.prio])));
    }
    function generateSuggestions(data,a){
      const s=[]; const add=(m,n,aw,b)=>s.push({massnahme:m,nutzen:n,aufwand:aw,bereich:b});
      if(!data.dataSources) add('Datenquellen konkret benennen','Höhere IT-Übergabefähigkeit','Niedrig','Datenbasis');
      if(!data.outputExample) add('Output-Beispiele inkl. Grenzfälle ergänzen','Bessere Architekturableitung und Testbarkeit','Niedrig','Input-/Output-Logik');
      if(data.qualityDefined!=='Ja') add('Fachliche Abnahmekriterien definieren','Messbare Qualität und belastbare Freigabe','Mittel','Qualitätssicherung');
      if(data.humanReview!=='Ja') add('Menschliche Prüfrolle verbindlich festlegen','Risikoreduktion und Governance-Konformität','Mittel','Human-in-the-loop');
      add('MVP-Scope in 4-6 Wochen Pilot schneiden','Schneller Erkenntnisgewinn bei überschaubarem Risiko','Mittel','MVP-/POC-Tauglichkeit');
      return s;
    }
    const generateTopGaps=(d,a)=>a.missing.slice(0,5);
    const generateTopRisks=(d,a)=>[...a.risk.drivers,...(d.personalData==='Unklar'?['Datenschutzangaben unklar']:[])].slice(0,5);
    const generateNextBestAction=(d,a)=>a.questions[0]?.frage||'Nächsten Iterations-Workshop mit Einreicher und IT durchführen.';
    function generateJiraComment(d,a){ if(a.traffic==='Grün') return `Deine Beschreibung ist aus unserer Sicht vollständig und fachlich wie technisch gut verständlich.\n\nDie Kolleg*innen aus der IT-Analytik schauen jetzt auf das Ticket.\nWenn dort auch alles passt, geht das Ticket in die unternehmerische Freigabe und wird im nächsten Steuerkreis KI besprochen.\n\nWir kommen dann aktiv auf dich zu.`; return `Danke für deinen Use Case. Wir haben einige Punkte identifiziert, die aktuell noch nicht vollständig oder eindeutig beschrieben sind.\n\nBitte beantworte die folgenden Rückfragen und ergänze ggf. das Prozesstemplate. Falls es noch nicht vorhanden ist, erstelle es bitte neu auf Basis der Vorlage.\n\nDanach gib die Anforderung wieder in die technische Bewertung zurück, damit wir sie erneut prüfen können.\n\nDie aus unserer Sicht offenen Punkte:\n\n${a.questions.map((q,i)=>`${i+1}. [${q.prio}] (${q.adressat}) ${q.frage}`).join('\n')}`; }
    function generateManagementSummary(d,a){ return `Titel: ${d.title||'—'}\nFachbereich: ${d.businessUnit||'—'}\nUse-Case-Art: ${a.template.type}\nReifegrad-Score: ${a.score}/100\nGesamtampel: ${a.traffic}\nEU-AI-Act: ${a.risk.level}\nKategorie: ${a.category.cat}\n\nKurzbeschreibung: ${d.description||'—'}\nZiel/Nutzen: ${d.goal||'—'}\nHauptrisiken: ${(a.topRisks.join(', ')||'keine wesentlichen Treiber erkannt')}\nOffene Punkte: ${(a.topGaps.join(', ')||'keine kritischen Lücken')}\nEmpfehlung: ${a.category.why}\nNächster sinnvoller Schritt: ${a.nextAction}\nIT-Übergabefähigkeit: ${a.areas.find(x=>x.name==='Übergabefähigkeit an IT').status}\nSteuerkreis-Reife: ${a.traffic==='Grün'?'bereit':'nach Nachschärfung erneut vorlegen'}`; }
    function generateJsonPayload(d,a){ return {timestamp:new Date().toISOString(),input:d,templateType:a.template,score:a.score,overallTrafficLight:a.traffic,areaAssessments:a.areas,euAiActRisk:a.risk,questions:a.questions,suggestions:a.suggestions,jiraComment:a.jira,managementSummary:a.mgmt,topGaps:a.topGaps,topRisks:a.topRisks,nextBestAction:a.nextAction}; }

    function evaluateUseCase(data){
      const template=detectTemplateType(data); const base=assessCompleteness(data); const risk=assessEuAiActRisk(data);
      const assessment={...base,template,risk}; assessment.score=calculateReadinessScore(data,assessment); assessment.traffic=determineOverallTrafficLight(data,assessment);
      assessment.category=determineCategory(data,assessment); assessment.questions=generateQuestions(data,assessment); assessment.suggestions=generateSuggestions(data,assessment);
      assessment.topGaps=generateTopGaps(data,assessment); assessment.topRisks=generateTopRisks(data,assessment); assessment.nextAction=generateNextBestAction(data,assessment);
      assessment.jira=generateJiraComment(data,assessment); assessment.mgmt=generateManagementSummary(data,assessment); assessment.json=generateJsonPayload(data,assessment);
      return assessment;
    }

    function renderSidebarState(data,a){ const el=document.getElementById('sidebarState'); if(!a){ el.innerHTML='<ul class="status-list"><li class="status-item">Noch keine Bewertung. Starte mit „Use Case bewerten“.</li><li class="status-item">Mini-Checklisten erscheinen nach der ersten Analyse.</li></ul>'; return; }
      const chk=(ok,part)=>ok?'erfüllt':part?'teilweise':'offen';
      el.innerHTML=`<ul class="status-list"><li class="status-item"><strong>Vollständigkeit:</strong> ${12-a.missing.length}/12 Kernangaben</li><li class="status-item"><strong>Top-Lücken:</strong> ${a.topGaps.join(', ')||'keine'}</li><li class="status-item"><strong>Nächste beste Aktion:</strong> ${a.nextAction}</li><li class="status-item"><strong>Status:</strong> ${a.traffic}</li><li class="status-item"><strong>Bereit für IT-Analytik?</strong><br>- Zielbild: ${chk(!!data.goal,!!data.description)}<br>- Datenquellen: ${chk(!!data.dataSources,false)}<br>- I/O: ${chk(!!data.inputData&&!!data.output,!!data.output)}<br>- Schnittstellen: ${chk(!!data.systems,false)}<br>- Datenschutz: ${chk(data.personalData!=='Unklar',data.personalData==='Unklar')}<br>- Human Review: ${chk(data.humanReview==='Ja',data.humanReview==='Unklar')}</li><li class="status-item"><strong>Bereit für Steuerkreis KI?</strong><br>- Business Impact: ${chk(!!data.businessImpact,false)}<br>- Risikostufe: ${chk(!!a.risk.level,false)}<br>- MVP/POC Scope: ${chk(data.targetState==='POC'||data.targetState==='MVP',!!data.targetState)}<br>- Verantwortlichkeiten: ${chk(!!data.ownerBusiness,!!data.ownerTech)}<br>- QS: ${chk(data.qualityDefined==='Ja',data.qualityDefined==='Teilweise')}<br>- Governance: ${chk(data.operatingModel!=='Unklar',data.operatingModel==='Pilot')}</li></ul>`;
    }

    function renderAssessment(a){
      const m=document.getElementById('heroMetrics');
      const metric = (l,v,c='empty')=>`<article class="metric ${c}"><div class="label">${l}</div><div class="value">${v}</div></article>`;
      if(!a) { m.innerHTML=[metric('READINESS SCORE','Noch keine Bewertung'),metric('EU AI ACT','Noch offen'),metric('USE CASE TYPE','Noch offen'),metric('IT HANDOVER','Nicht bewertet')].join(''); return; }
      m.innerHTML=[metric('READINESS SCORE',`${a.score}/100`),metric('EU AI ACT',a.risk.level,'') ,metric('USE CASE TYPE',a.template.type,''),metric('IT HANDOVER',a.areas.find(x=>x.name==='Übergabefähigkeit an IT').status,'')].join('');

      document.getElementById('results').style.display='block';
      const rb=document.getElementById('resultBody');
      rb.innerHTML=`<div class="result-top"><div class="score-wrap"><h3>Gesamtbewertung: <span class="badge ${a.traffic==='Grün'?'b-green':a.traffic==='Gelb'?'b-yellow':'b-red'}">${a.traffic}</span></h3><div class="score-bar" aria-label="Reifegrad"><div class="score-fill" id="scoreFill"></div></div><p><strong>Kategorie:</strong> ${a.category.cat} – ${a.category.why}</p><p><strong>EU-AI-Act:</strong> ${a.risk.level} – ${a.risk.reason}</p></div><div class="score-wrap"><h3>Top-5</h3><p><strong>Lücken:</strong></p><ul class="list">${a.topGaps.map(x=>`<li>${x}</li>`).join('')||'<li>Keine</li>'}</ul><p><strong>Risiken:</strong></p><ul class="list">${a.topRisks.map(x=>`<li>${x}</li>`).join('')||'<li>Keine</li>'}</ul></div></div><div id="tabsContainer" class="tabs"></div>`;
      requestAnimationFrame(()=>document.getElementById('scoreFill').style.width = a.score+'%');
      renderTabs(a);
      document.getElementById('results').scrollIntoView({behavior:'smooth'});
    }

    function renderTabs(a){
      const tabs=[['Überblick',`<p><strong>Nächste beste Aktion:</strong> ${a.nextAction}</p><p><strong>Template-Erkennung:</strong> ${a.template.type}<br>${a.template.reason}</p>`],['Ampelbewertung',a.areas.map(x=>`<p><span class="badge ${x.status==='Grün'?'b-green':x.status==='Gelb'?'b-yellow':'b-red'}">${x.status}</span> <strong>${x.name}</strong><br>${x.bewertung}<br><em>Empfehlung:</em> ${x.empfehlung}</p>`).join('')],['EU AI Act',`<p><strong>${a.risk.level}</strong> – ${a.risk.reason}</p><p><strong>Risikotreiber:</strong> ${(a.risk.drivers.join(', ')||'keine')}</p><ul class="list">${a.risk.measures.map(x=>`<li>${x}</li>`).join('')}</ul>`],['Rückfragen',a.questions.map(q=>`<p><strong>[${q.prio}] ${q.adressat}</strong> – ${q.frage}<br><em>${q.begruendung} (${q.bereich})</em></p>`).join('')||'<p>Keine Rückfragen.</p>'],['Empfehlungen',a.suggestions.map(s=>`<p><strong>${s.massnahme}</strong> (${s.aufwand})<br>${s.nutzen} – <em>${s.bereich}</em></p>`).join('')],['JIRA-Kommentar',`<div class="toolbar"><button type="button" id="btnCopyJira">JIRA-Kommentar kopieren</button></div><pre id="jiraText"></pre>`],['Management Summary',`<div class="toolbar"><button type="button" id="btnGenSummary">Management Summary generieren</button><button type="button" id="btnCopySummary">Management Summary kopieren</button><button type="button" id="btnPrintSummary">Druckansicht Management Summary</button></div><pre id="managementSummary">Noch nicht generiert.</pre>`],['JSON',`<div class="toolbar"><button type="button" id="btnExportJson">Bewertung als JSON exportieren</button><button type="button" id="btnCopyJson">JSON kopieren</button></div><pre id="jsonText"></pre>`]];
      const tc=document.getElementById('tabsContainer');
      tc.innerHTML=`<div class="tab-buttons" role="tablist">${tabs.map((t,i)=>`<button class="tab-btn" role="tab" id="tab${i}" aria-controls="panel${i}" aria-selected="${i===0}" type="button">${t[0]}</button>`).join('')}</div>${tabs.map((t,i)=>`<section class="tab-panel ${i===0?'active':''}" role="tabpanel" id="panel${i}" aria-labelledby="tab${i}">${t[1]}</section>`).join('')}`;
      tc.querySelectorAll('.tab-btn').forEach((b,i)=>b.addEventListener('click',()=>{tc.querySelectorAll('.tab-btn').forEach((x,j)=>x.setAttribute('aria-selected',j===i)); tc.querySelectorAll('.tab-panel').forEach((p,j)=>p.classList.toggle('active',j===i));}));
      document.getElementById('jiraText').textContent=a.jira; document.getElementById('jsonText').textContent=JSON.stringify(a.json,null,2);
      document.getElementById('btnCopyJira').onclick=()=>copyText(a.jira,'JIRA-Kommentar kopiert.');
      document.getElementById('btnGenSummary').onclick=()=>{document.getElementById('managementSummary').textContent=a.mgmt; showToast('Management Summary generiert.','ok');};
      document.getElementById('btnCopySummary').onclick=()=>copyText(document.getElementById('managementSummary').textContent,'Management Summary kopiert.');
      document.getElementById('btnPrintSummary').onclick=()=>window.print();
      document.getElementById('btnExportJson').onclick=()=>exportJson();
      document.getElementById('btnCopyJson').onclick=()=>copyText(JSON.stringify(a.json,null,2),'JSON kopiert.');
    }

    async function copyText(text,msg='Kopiert.'){ try{ if(navigator.clipboard){ await navigator.clipboard.writeText(text); showToast(msg,'ok'); return true; } throw new Error('Clipboard API nicht verfügbar'); } catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); showToast(ok?msg:'Kopieren fehlgeschlagen.','ok'); return ok; } }
    function exportJson(){ if(!lastAssessment) return showToast('Erst bewerten.','warn'); const blob=new Blob([JSON.stringify(lastAssessment.json,null,2)],{type:'application/json'}); const a=document.createElement('a'); const d=new Date().toISOString().slice(0,10); a.href=URL.createObjectURL(blob); a.download=`ki-use-case-bewertung-${d}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('JSON exportiert.','ok'); }
    function saveDraft(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(collectFormData())); showToast('Zwischenstand gespeichert.','ok'); }
    function loadDraft(){ const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return showToast('Kein gespeicherter Stand gefunden.','warn'); populateForm(JSON.parse(raw)); showToast('Gespeicherter Stand geladen.','ok'); }
    function clearDraft(){ localStorage.removeItem(STORAGE_KEY); showToast('Lokale Daten gelöscht.','ok'); }
    function loadExampleData(){ populateForm({title:'Automatisierte Vorbewertung von KI-Use-Cases',businessUnit:'KI-Governance / Business Analyse',submitter:'Victor',description:'Ein KI-Assistent soll eingereichte KI-Use-Cases anhand eines strukturierten Templates prüfen, Rückfragen erzeugen, Risiken einschätzen und einen JIRA-Kommentar vorbereiten.',goal:'Die fachliche und technische Vorprüfung soll standardisiert und beschleunigt werden. Ziel ist eine bessere Übergabequalität an IT-Analytik, FEX und Steuerkreis KI.',process:'Einreichung, Prüfung und Freigabe von KI-Use-Cases',currentState:'Use Cases werden aktuell uneinheitlich beschrieben. Rückfragen entstehen häufig spät und technische Angaben fehlen teilweise.',targetProcess:'Use Cases werden anhand eines strukturierten Bewertungsrasters geprüft. Fehlende Angaben, Risiken und nächste Schritte werden früh sichtbar.',inputData:'Prozesstemplate, JIRA-Ticket, fachliche Beschreibung des Einreichers, ggf. ergänzende Richtlinien.',dataSources:'JIRA-Ticket, Prozesstemplate, KI-Dienstanweisung, fachliche Angaben des Einreichers.',output:'Ampelbewertung, Rückfragen, EU-AI-Act-Risikostufe, JIRA-Kommentar und Management Summary.',outputExample:'Gesamtampel Gelb, Risikostufe begrenztes Risiko, offene Punkte zu Datenquellen und Qualitätssicherung, JIRA-Kommentar mit priorisierten Rückfragen.',textGeneration:'Ja',mlOps:'Nein',chatInteraction:'Ja',externalOutput:'Nein',humanReview:'Ja',qualityDefined:'Teilweise',qualityDesc:'Bewertungen sollen nachvollziehbar, vollständig und konsistent sein. Stichprobenprüfung durch Victor ist vorgesehen.',personalData:'Unklar',sensitiveData:'Nein',autoDecisionPeople:'Nein',highRiskDomain:'Nein',businessImpact:'Reduktion von Rückfragen, schnellere technische Bewertung und bessere Entscheidungsqualität im Steuerkreis KI.',strategy:'Mittel',operatingModel:'Pilot'}); showToast('Beispieldaten geladen.','ok'); }
    function resetForm(){ document.getElementById('useCaseForm').reset(); document.querySelectorAll('.inline-error').forEach(e=>e.textContent=''); showToast('Formular zurückgesetzt.','ok'); }
    function showToast(message){ const t=document.getElementById('toast'); t.textContent=message; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1700); }

    function bind(){
      document.getElementById('btnEvaluate').onclick=()=>{ useCaseData=collectFormData(); const v=validateForm(useCaseData); if(!v.ok) showToast('Bitte Pflichtfelder ergänzen.','warn'); const a=evaluateUseCase(useCaseData); lastAssessment=a; renderAssessment(a); renderSidebarState(useCaseData,a); };
      document.getElementById('btnExample').onclick=loadExampleData;
      document.getElementById('btnReset').onclick=resetForm;
      document.getElementById('btnSave').onclick=saveDraft;
      document.getElementById('btnLoad').onclick=loadDraft;
      document.getElementById('btnClear').onclick=clearDraft;
    }

    createForm(); renderAssessment(null); renderSidebarState({},null); bind();
  </script>
</body>
</html>
